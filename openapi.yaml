openapi: 3.2.0

info:
  title: Miniblog API
  description: API REST para gestionar autores y posts
  version: 1.0.0
  contact:
    name: Mateo Zapata
    email: mattalexxz@gmail.com

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo

tags:
  - name: Authors
    description: Operaciones relacionadas con autores

  - name: Posts
    description: Operaciones relacionadas con posts

paths:

  /api/authors:
    get:
      tags:
        - Authors
      summary: Obtener todos los autores
      description: Devuelve una lista de todos los autores registrados en la base de datos
      responses:
        '200':
          description: Lista de autores obtenida correctamente
          content: 
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Error interno del servidor


    post:
      tags:
        - Authors
      summary: Crear un nuevo autor
      description: Crea un nuevo autor en la base de datos

      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#components/schemas/AuthorInput'

      responses:
        '201':
          description: Autor creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Autor creado exitosamente
                  autor:
                    $ref: '#components/schemas/Author'

        '400':
          description: Datos requeridos faltantes
          content:
            application/json:
              schema:
                $ref: '#components/schemas/Error'
              example:
                error: Nombre y email son requeridos

        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#components/schemas/Error'
              example:
                error: El email ya está registrado

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#components/schemas/Error'
              example:
                error: Error interno del servidor



  /api/authors/{id}:
    get:
      tags:
        - Authors
      summary: Obtener un autor por ID
      description: Devuelve un autor específico mediante su ID

      parameters:
        - name: id
          in: path
          required: true
          description: ID del autor
          schema:
            type: integer
            example: 1

      responses:
        '200':
          description: Autor obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'

        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El ID debe ser un número

        '404':
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No se encontró el autor

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Error interno del servidor



    put:
      tags:
        - Authors
      summary: Actualizar un autor
      description: Actualiza los datos de un autor existente mediante su ID

      parameters:
        - name: id
          in: path
          required: true
          description: ID del autor
          schema:
            type: integer
            example: 16

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#components/schemas/AuthorInput'

      responses:
        '200':
          description: Autor actualizado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Autor actualizado con éxito
                  autor:
                    $ref: '#/components/schemas/Author'

        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El ID debe ser un número

        '404':
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: '#components/schemas/Error'
              example:
                error: No se encontró el autor

        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: 'components/schemas/Error'
              example:
                error: El email ya está registrado

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: 'components/schemas/Error'
              example:
                error: Error interno del servidor



  
    

components:

  schemas:
    Author:
      type: object
      properties: 
        id_author:
          type: integer
          example: 16
        name:
          type: string
          example: Juan Pérez
        email:
          type: string
          example: juan@email.com
        bio:
          type: string
          example: Escritor técnico especializado en bases de datos



    AuthorInput:
      type: object
      properties:
        name:
          type: string
          example: Juan Pérez
        email:
          type: string
          example: juan@email.com
        bio:
          type: string
          example: Escritor técnico especializado en bases de datos



    Error:
      type: object
      properties:
        error:
          type: string
          


